<button
        class="plug-card"
        type="button"
        (click)="toggle()"
        [class.is-on]="isOn"
        [class.collapsed]="collapsed"
        [attr.aria-pressed]="isOn"
>
    <svg viewBox="0 0 550 310" role="img" aria-label="Animated plug connector">
        <defs>
            <linearGradient id="bgOff" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d7d7d7" />
                <stop offset="100%" stop-color="#9f9f9f" />
            </linearGradient>

            <linearGradient id="bgOn" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ff8a00" />
                <stop offset="100%" stop-color="#ff4d00" />
            </linearGradient>

            <linearGradient id="plastic" x1="0" y1="0" x2="2" y2="1">
                <stop offset="0%" stop-color="#0e0f0f" />
                <stop offset="30%" stop-color="#72696969" />
                <stop offset="70%" stop-color="#eeeeee" />
                <stop offset="100%" stop-color="#cfcfcf" />
            </linearGradient>

            <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f8f8f8" />
                <stop offset="45%" stop-color="#9d9d9d" />
                <stop offset="100%" stop-color="#f0f0f0" />
            </linearGradient>

            <filter id="shadow" filterUnits="userSpaceOnUse" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="30" stdDeviation="12" flood-opacity="0.25" />
            </filter>

            <filter id="plugShadow" filterUnits="userSpaceOnUse" x="-20%" y="-20%" width="160%" height="160%">
                <feDropShadow dx="4" dy="16" stdDeviation="18" flood-opacity="0.45" />
            </filter>
        </defs>

        <rect class="bg bg-off" width="550" height="310" rx="32" fill="url(#bgOff)" />
        <rect class="bg bg-on" width="550" height="310" rx="32" fill="url(#bgOn)" />

        <text class="label label-off" x="125" y="295" textLength="300" lengthAdjust="spacingAndGlyphs">OFF</text>
        <text class="label label-on" x="110" y="295" textLength="320" lengthAdjust="spacingAndGlyphs">ON</text>

        <g class="clip-group">
            <g filter="url(#shadow)">
                <!-- left cable -->
                <path class="cable" d="M -239 207 C -156 213 71 182 286 190" />

                <!-- right cable -->
                <path class="cable right-cable" d="M 696 199 C 1259 233 902 5 1238 -9" transform="translate(30, -10)"/>

                <!-- male plug -->
                <g class="right-plug" transform="translate(50, 0)">
                    <rect x="610" y="130" width="210" height="120" rx="26" fill="url(#plastic)" />
                    <rect x="800" y="158" width="42" height="64" rx="14" fill="url(#plastic)" />
                    <path d="M592 115 H614 a20 20 0 0 1 20 20 V245 a20 20 0 0 1 -20 20 H592 Z" fill="url(#plastic)" />
                    <ellipse cx="592" cy="156" rx="2" ry="16" fill="#8f8f8f" />
                    <ellipse cx="592" cy="231" rx="2" ry="16" fill="#8f8f8f" />

                    <g class="pins" transform="translate(-18, 0)">
                        <path d="M610 145 H537 a12 12 0 0 0 -12 12 a12 12 0 0 0 12 12 H610 Z" fill="url(#metal)" />
                        <path d="M610 220 H537 a12 12 0 0 0 -12 12 a12 12 0 0 0 12 12 H610 Z" fill="url(#metal)" />
                    </g>
                </g>

                <!-- female plug -->
                <g class="left-plug" filter="url(#plugShadow)">
                    <rect x="250" y="130" width="210" height="120" rx="26" fill="url(#plastic)" />
                    <rect x="226" y="158" width="42" height="64" rx="14" fill="url(#plastic)" />
                    <path d="M477 115 H455 a20 20 0 0 0 -20 20 V245 a20 20 0 0 0 20 20 H477 Z" fill="url(#plastic)" />
                    <ellipse cx="477" cy="156" rx="1.5" ry=16 fill="#8f8f8f" />
                    <ellipse cx="477" cy="231" rx="1.5" ry=16 fill="#8f8f8f" />
                </g>
            </g>
        </g>
    </svg>
</button>
